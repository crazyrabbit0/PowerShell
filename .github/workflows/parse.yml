name: Parse

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) {
              Write-Host "::error file=$($_.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed++
            }
          }
          if ($failed) { exit 1 }
          Write-Host 'All scripts parse.'
